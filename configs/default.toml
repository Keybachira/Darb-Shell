# Darb Shell — default configuration (see Stacks §26, Arquitetura §52).
# Human-edited config uses TOML. Secrets must use env vars, never this file.

[app]
language = "pt"
profile = "eco"

[provider]
# `model = "auto"` (or empty) hands the choice to the router, which reads
# `configs/models.toml` under `budget`. Naming a model here overrides
# routing entirely — the model you typed is the model you get.
name = "openai"
model = "auto"
budget = "cheapest"
catalogue = "configs/models.toml"

[interface]
language = "pt"
mouse = true
animations = false
compact = false

[context]
max_tokens = 16000
lazy_indexing = true

[performance]
profile = "eco"

[permissions]
read = "allow"
edit = "ask"
shell = "ask"
delete = "ask"
git_push = "deny"
